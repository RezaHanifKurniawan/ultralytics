# Ultralytics YOLO11-seg instance segmentation model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-seg.yaml' will call yolo11-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 203 layers, 2876848 parameters, 2876832 gradients, 10.5 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 203 layers, 10113248 parameters, 10113232 gradients, 35.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 253 layers, 22420896 parameters, 22420880 gradients, 123.9 GFLOPs
  l: [1.00, 1.00, 512] # summary: 379 layers, 27678368 parameters, 27678352 gradients, 143.0 GFLOPs
  x: [1.00, 1.50, 512] # summary: 379 layers, 62142656 parameters, 62142640 gradients, 320.2 GFLOPs

# YOLO11s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2 (Resolusi / 2)
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4 (Resolusi / 4)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8 (Resolusi / 8)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16 (Resolusi / 16)
  - [-1, 2, C3k2, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32 (Resolusi / 32)
  - [-1, 2, C3k2, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9 (Spatial Pyramid Pooling Fast)
  - [-1, 2, C2PSA, [1024]]            # 10 (Backbone Output)

# YOLO11s head + sanet
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11: Upsample P5 ke resolusi P4
  - [[-1, 6], 1, Concat, [1]]                  # 12: Gabung fitur Head 11 + Backbone P4 (layer 6)
  - [-1, 2, C3k2, [512, False]]                # 13: Blok konvolusi jalur Neck P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14: Upsample P4 ke resolusi P3
  - [[-1, 4], 1, Concat, [1]]                  # 15: Gabung fitur Head 14 + Backbone P3 (layer 4)
  - [-1, 2, C3k2, [256, False]]                # 16: Blok konvolusi jalur Neck P3 (P3/8-small)
  - [-1, 1, SANet, [8]]                        # 17: Jalur Atensi SANet P3 Aktif (groups=8)

  - [-1, 1, Conv, [256, 3, 2]]                 # 18: Downsample fitur P3 ke P4
  - [[-1, 13], 1, Concat, [1]]                 # 19: Gabung fitur Head 18 + Neck P4 (layer 13)
  - [-1, 2, C3k2, [512, False]]                # 20: Blok konvolusi jalur Neck P4 (P4/16-medium)
  - [-1, 1, SANet, [8]]                        # 21: Jalur Atensi SANet P4 Aktif (groups=8)

  - [-1, 1, Conv, [512, 3, 2]]                 # 22: Downsample fitur P4 ke P5
  - [[-1, 10], 1, Concat, [1]]                 # 23: Gabung fitur Head 22 + Backbone Output P5 (layer 10)
  - [-1, 2, C3k2, [1024, True]]                # 24: Blok konvolusi jalur Neck P5 (P5/32-large)
  - [-1, 1, SANet, [8]]                        # 25: Jalur Atensi SANet P5 Aktif (groups=8)

  - [[17, 21, 25], 1, Segment, [nc, 32, 256]]  # 26: Segmentasi Masker multi-skala (P3, P4, P5)
